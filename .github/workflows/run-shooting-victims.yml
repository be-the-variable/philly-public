name: Run shooting victims pipeline

on:
  schedule:
    # 11:00am Eastern. GitHub Actions runs in UTC and does NOT adjust for
    # daylight saving. This is 15:00 UTC, which is correct during EDT
    # (mid-March to early November). During EST (Nov-March) this will
    # actually fire at 10:00am Eastern. If exact year-round timing matters,
    # see the note in the README/PR description for a DST-aware option.
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button for testing

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # safety net in case a hung network call would otherwise run indefinitely

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # faster binary installs on Linux

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # points at the DESCRIPTION file so system libs (GDAL/GEOS/PROJ for sf)
          # get installed automatically via apt, and R packages get cached
          extra-packages: |
            dplyr
            sf
            tidycensus
            readr

      - name: Run pipeline script
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: Rscript scripts/process_shooting_data.R

      - name: Commit and push output
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add shooting_victims_processed.csv
          git diff --staged --quiet || git commit -m "Automated data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
